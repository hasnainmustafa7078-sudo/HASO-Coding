<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aptech Records</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            color: #222;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
            color: #17365d;
        }

        .section {
            margin-bottom: 50px;
        }

        .section-title {
            background-color: #17365d;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
            border-left: 5px solid #17365d;
        }

        .card h3 {
            margin-top: 0;
            color: #17365d;
        }

        .card p {
            margin: 8px 0;
            color: #555;
        }

        .label {
            font-weight: bold;
            color: #222;
        }

    </style>
</head>
<body>
    <h1>ACCP-AI Student Management System</h1>

    <!-- Students Records-->

    <div class="section">
        <h2 class="section-title">Students</h2>
        <div id="students" class="cards-container"></div>
    </div>

    <!-- Parents Records-->

    <div class="section">
        <h2 class="section-title">Parents</h2>
        <div id="parents" class="cards-container"></div>
    </div>

    <!-- Teachers Records -->

    <div class="section">
        <h2 class="section-title">Teachers</h2>
        <div id="teachers" class="cards-container"></div>
    </div>

    <script src="script.js"></script>

</body>
</html>
